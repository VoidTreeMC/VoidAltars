#The �main:� line needs to list the package and class name of the class which is loaded by Spigot when it loads the plugin�s jar file.
main: com.condor.voidaltars.main.AltarMain
name: VoidAltars
version: 0.0.3
api-version: 1.18
authors: [Iron-Condor]
description: Void Altar plugin
load: POSTWORLD
prefix: ALTAR
depend: [Vault, Towny]
commands:
   altarreloadtext:
       description: Reloads text constants for altars
       usage: /altarreloadtext
       permission: condor.altar.reload.text
       permission-message: You do not have permission to use this command.
   setaltarlevel:
       description: Sets the altar's level
       usage: /setaltarlevel <town name> <level>
       permission: condor.altar.setlevel
       permission-message: You do not have permission to use this command.
   refreshsacrifices:
       description: Refreshes an altar's sacrifices
       usage: /refreshsacrifices <town name> <altar type>
       permission: condor.altar.refreshsacrifices
       permission-message: You do not have permission to use this command.
   addsacrifices:
       description: Adds 'n' amount of sacrifices to an altar
       usage: /addsacrifices <town name> <n>
       permission: condor.altar.addsacrifices
       permission-message: You do not have permission to use this command.
   altartop:
       description: Command that displays a list of altars by rank
   altar:
      description: Supercommand that handles a variety of altar commands
